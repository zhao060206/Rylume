<!doctype html><meta charset="utf-8"><title>Rylume structure editing QA</title>
<link rel="stylesheet" href="/ui/element-editor.css"><style>body{margin:0;font:14px Arial}header{height:50px;padding:10px;box-sizing:border-box}#host{height:calc(100vh - 145px);position:relative;background:#e9edef;overflow:hidden}#host>svg{position:absolute}#result{position:fixed;right:10px;top:54px;max-width:350px;max-height:180px;overflow:auto;background:#fff;font-size:11px;z-index:20}button{padding:6px 12px}</style>
<header><button id="open-annotations" hidden></button><button id="run" disabled>Run complete structure drag / undo / pixel checks</button><span id="status">Loading…</span></header><pre id="result"></pre><div id="host" tabindex="0"></div>
<script type="module">
import{SceneEditor}from'/ui/canvas-editor.js';import{setupElementEditing}from'/ui/element-editor.js';
const host=document.getElementById('host'),changes=[],editor=new SceneEditor({host,onChange:ops=>changes.push(ops)}),mode=setupElementEditing({editor,toast(m){document.getElementById('status').textContent=m;}});
const [scene,svg]=await Promise.all([fetch('/scene.json').then(r=>r.json()),fetch('/figure.svg').then(r=>r.text())]);const start=performance.now();editor.setDocument(scene,svg);document.getElementById('status').textContent='Ready';document.getElementById('run').disabled=false;
host.setPointerCapture=()=>{};host.hasPointerCapture=()=>false;
// The in-app automation tab may be occluded. Use a controlled frame clock and
// a Canvas readback fence; these are render-work timings, not a display FPS claim.
window.requestAnimationFrame=cb=>setTimeout(()=>cb(performance.now()),0);window.cancelAnimationFrame=clearTimeout;
const tick=()=>new Promise(r=>setTimeout(()=>{editor.traceSurface.ctx.getImageData(0,0,1,1);r();},16));
function pointer(type,p){const c=new DOMPoint(p.x,p.y).matrixTransform(host.querySelector('svg').getScreenCTM());host.dispatchEvent(new PointerEvent(type,{bubbles:true,button:0,clientX:c.x,clientY:c.y,pointerId:31}));}
function check(v,m){if(!v)throw Error(m);}
document.getElementById('run').onclick=()=>{setTimeout(async()=>{try{
 const initial=editor.traceSurface.canvas.toDataURL(),initialPixels=editor.traceSurface.ctx.getImageData(0,0,editor.traceSurface.canvas.width,editor.traceSurface.canvas.height).data,before=JSON.stringify(editor.scene.objects),initialPaths=editor.traceSurface.items.length;
 function pixelError(a=initialPixels){const b=editor.traceSurface.ctx.getImageData(0,0,editor.traceSurface.canvas.width,editor.traceSurface.canvas.height).data;let sum=0,max=0,large=0;for(let i=0;i<b.length;i++){const d=Math.abs(a[i]-b[i]);sum+=d;max=Math.max(max,d);if(d>8)large++;}return{mean:sum/b.length,max,large_fraction:large/b.length};}
 const t=performance.now();pointer('pointerdown',{x:129,y:31});pointer('pointerup',{x:129,y:31});const selectionMs=performance.now()-t;
 check(editor.scene.structures?.length===1,'Click identifies one complete structure');
 const group=editor.scene.structures[0],count=group.parts.reduce((a,p)=>a+p.indices.length,0);check(count>10,'Structure includes its outline, fills and internal details');
 const groupingError=pixelError();check(groupingError.mean<.1,'Grouping appearance '+JSON.stringify(groupingError));
 const fixture=document.createElement('script');fixture.type='application/json';fixture.id='grouped-fixture';fixture.textContent=JSON.stringify(editor.scene);document.body.append(fixture);await fetch('/snapshot/grouped',{method:'POST',body:fixture.textContent});const groupedPixels=editor.traceSurface.ctx.getImageData(0,0,editor.traceSurface.canvas.width,editor.traceSurface.canvas.height).data,grouped=JSON.stringify(editor.scene.objects),frames=[],paints=[];pointer('pointerdown',{x:129,y:31});const groupsBefore=editor.scene.structures.length;const gestureAtStart=mode.gestureKind,hitAfterGroup=editor.traceSurface.hit({x:129,y:31});
 for(let i=1;i<=24;i++){const at=performance.now();pointer('pointermove',{x:129+i/4,y:31+i/10});await tick();frames.push(performance.now()-at);paints.push(editor.traceSurface.stats.lastPaintMs);}
 const gestureAtEnd=mode.gestureKind;pointer('pointerup',{x:135,y:33.4});const movedFixture=document.createElement('script');movedFixture.type='application/json';movedFixture.id='moved-fixture';movedFixture.textContent=JSON.stringify(editor.scene);document.body.append(movedFixture);const displayed=editor.traceSurface.compositor.frame(editor.scene.structures,editor.traceSurface.structurePreview);await fetch('/snapshot/display',{method:'POST',body:JSON.stringify({png:displayed.toDataURL()})});check(host.querySelector('[data-structure-display] foreignObject')?.getAttribute('transform').includes('6'),'Display layer follows complete structure');await fetch('/snapshot/moved',{method:'POST',body:movedFixture.textContent});check(changes.at(-1).length===1&&changes.at(-1)[0].op==='set_structures','Every structure member moves as one operation '+JSON.stringify({gestureAtStart,gestureAtEnd,hit:hitAfterGroup?.owner,selected:mode.selectedStructureIds}));editor.undo();check(JSON.stringify(editor.scene.objects)===grouped,'Undo restores exact grouped source; groups before drag: '+groupsBefore);const partialError=pixelError(groupedPixels);editor.traceSurface.paint();const fullError=pixelError(groupedPixels);check(partialError.mean<.25&&partialError.large_fraction<.003,'Partial paint difference '+JSON.stringify({partialError,fullError}));check(fullError.mean<.25&&fullError.large_fraction<.003,'Full paint difference '+JSON.stringify(fullError));editor.undo();check(JSON.stringify(editor.scene.objects)===before,'Undo grouping restores exact vector source');
 const sorted=[...frames].sort((a,b)=>a-b);document.getElementById('result').textContent=JSON.stringify({passed:true,structure_timings:editor.structureTimings,selection_ms:selectionMs,group_parts:count,owners:group.parts.length,live_paths:host.querySelectorAll('path').length,source_paths:initialPaths,partialError,fullError,frame_ms:{median:sorted[Math.floor(sorted.length/2)],max:Math.max(...frames)},paint_ms:{median:[...paints].sort((a,b)=>a-b)[12],max:Math.max(...paints)},checks:['whole organelle','pixel-exact grouping','continuous drag','one gesture','exact vector undo','source restoration']},null,2);
 }catch(e){document.getElementById('result').textContent=e.stack+'\n'+JSON.stringify({changes:changes.map(x=>x.map(o=>o.op)),groups:editor.scene.structures?.map(g=>({id:g.id,dx:g.dx,dy:g.dy,parts:g.parts.length})),mode:document.querySelector('[aria-label=编辑粒度]').value});}},30);};
</script>
